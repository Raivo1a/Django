[tool.poetry]
name = "djangoproject"
version = "0.1.0"
description = ""
authors = ["Christine Ekke <k.ekke2906@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
isort = "^6.1.0"
black = "^25.9.0"
mypy = "^1.18.2"
django = "^5.2.7"
pillow = "^12.0.0"
ipython = "^9.6.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
  )/
)
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'